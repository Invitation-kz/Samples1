<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Әділ & Айгүл</title>

  <link href="https://fonts.googleapis.com/css2?family=Piazzolla:wght@100;300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #f1eff1;
      font-family: 'Piazzolla', serif;
      overflow-x: hidden;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    a {
      display: block;
    }

    /* Фотолардың пайда болу анимациясы */
    .element-animation {
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .element-animation.element-show {
      opacity: 1;
    }

    /* ТАЙМЕР - толығымен көлденең, бір жолды, түсі #f1eff1 */
    .timer-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .timer-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      text-align: center;
    }
    .timer-grid {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 10px 20px;
      pointer-events: auto;
      background: transparent;
      padding: 10px 20px;
      white-space: nowrap;
    }
    .timer-item {
      text-align: center;
      display: inline-block;
    }
    .timer-item .number {
      display: block;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 300;
      color: #f1eff1;
      letter-spacing: 2px;
      line-height: 1;
    }
    .timer-item .label {
      display: block;
      font-size: clamp(0.6rem, 1.5vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #f1eff1;
      margin-top: 2px;
      font-weight: 300;
    }
    .timer-divider {
      font-size: clamp(1.5rem, 5vw, 3rem);
      font-weight: 100;
      color: #f1eff1;
      padding-top: 5px;
      display: inline-block;
    }

    /* ФОРМА */
    .form-wrapper {
      background: #f1eff1;
      padding: 10px 15px 30px;
    }
    .form-container {
      background: transparent;
      padding: 0;
      max-width: 450px;
      margin: 0 auto;
    }
    .form-inner {
      text-align: center;
    }
    .form-inner .radio-group {
      text-align: left;
      margin-bottom: 12px;
    }
    .form-inner .radio-group p {
      font-weight: 300;
      margin-bottom: 4px;
      color: #000000;
      font-size: 0.95rem;
    }
    .form-inner .radio-group label {
      font-weight: 300;
      margin-left: 4px;
      color: #000000;
      font-size: 0.9rem;
    }
    .form-inner .radio-group input[type="radio"] {
      margin-right: 2px;
      accent-color: #000000;
      width: 14px;
      height: 14px;
    }
    .form-inner textarea {
      width: 100%;
      border: none;
      border-bottom: 1px solid #999;
      border-radius: 0;
      padding: 8px 4px 4px;
      font-size: 0.9rem;
      background: transparent;
      resize: vertical;
      min-height: 40px;
      font-family: inherit;
      color: #000000;
      outline: none;
      transition: border-color 0.3s;
    }
    .form-inner textarea:focus {
      border-bottom-color: #000000;
    }
    .form-inner textarea::placeholder {
      color: #888;
      font-weight: 200;
    }
    .btn-submit {
      background: transparent;
      color: #000000;
      border: 1px solid #000000;
      border-radius: 30px;
      padding: 10px 30px;
      font-size: 0.9rem;
      font-weight: 300;
      letter-spacing: 2px;
      width: 100%;
      transition: 0.3s;
      margin-top: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-submit:hover {
      background: #000000;
      color: #ffffff;
    }

    /* МОДАЛЬНОЕ ОКНО - черно-белый стиль */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.5s ease;
    }
    .modal-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .modal-content {
      background: #ffffff;
      padding: 40px 30px 45px;
      border-radius: 20px;
      text-align: center;
      max-width: 380px;
      width: 85%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      border: 1px solid #000000;
    }
    .modal-content img {
      width: 100%;
      max-width: 250px;
      margin: 0 auto 20px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }
    .modal-content button {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 14px 40px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 2px;
      cursor: pointer;
      transition: 0.3s;
      font-family: 'Piazzolla', serif;
      border: 1px solid #000000;
    }
    .modal-content button:hover {
      background: #ffffff;
      color: #000000;
      border: 1px solid #000000;
      transform: scale(1.03);
    }
    .modal-content button:active {
      transform: scale(0.97);
    }

    @media (max-width: 576px) {
      .timer-grid {
        gap: 5px 10px;
        padding: 8px 10px;
      }
      .timer-divider {
        padding-top: 2px;
        font-size: 1.2rem;
      }
      .timer-item .number {
        font-size: 1.8rem;
      }
      .timer-item .label {
        font-size: 0.5rem;
      }
    }
  </style>
</head>
<body>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="musicModal" class="modal-overlay">
  <div class="modal-content">
    <img src="photo.jpg" alt="приглашение">
    <button id="playMusicBtn">Шақыртуды ашу</button>
  </div>
</div>

<!-- АУДИО -->
<audio id="backgroundMusic" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- ФОТО 1 -->
<div class="element-animation"><img src="photo1.jpg" alt="photo1"></div>

<!-- ФОТО 2 -->
<div class="element-animation"><img src="photo2.jpg" alt="photo2"></div>

<!-- ФОТО 3 -->
<div class="element-animation"><img src="photo3.jpg" alt="photo3"></div>

<!-- ФОТО 4 (КАРТА) -->
<div class="element-animation">
  <a href="https://2gis.kz/semey/geo/70030076250487585" target="_blank">
    <img src="photo4.jpg" alt="photo4">
  </a>
</div>

<!-- ФОТО 5 -->
<div class="element-animation"><img src="photo5.jpg" alt="photo5"></div>

<!-- ФОТО 6 + ТАЙМЕР -->
<div class="timer-wrapper element-animation" style="position:relative;">
  <img src="photo6.jpg" alt="photo6">
  <div class="timer-overlay">
    <div class="timer-grid">
      <div class="timer-item">
        <span class="number" id="days">00</span>
        <span class="label">Күн</span>
      </div>
      <span class="timer-divider">|</span>
      <div class="timer-item">
        <span class="number" id="hours">00</span>
        <span class="label">Сағат</span>
      </div>
      <span class="timer-divider">|</span>
      <div class="timer-item">
        <span class="number" id="minutes">00</span>
        <span class="label">Минут</span>
      </div>
      <span class="timer-divider">|</span>
      <div class="timer-item">
        <span class="number" id="seconds">00</span>
        <span class="label">Секунд</span>
      </div>
    </div>
  </div>
</div>

<!-- ФОТО 7 -->
<div class="element-animation"><img src="photo7.jpg" alt="photo7"></div>

<!-- ФОРМА -->
<div class="form-wrapper">
  <div class="form-container">
    <form id="form">
      <div class="form-inner">
        <div class="radio-group">
          <p>Жұбыңызбен келсеңіз, есімін жазыңыз</p>
          <textarea name="message" id="message" placeholder="Есіміңіз" rows="1"></textarea>
        
          <input type="radio" id="q1_yes" name="name" value="Әрине келемін" required>
          <label for="q1_yes">Әрине келемін</label><br>
          <input type="radio" id="q1_no" name="name" value="Өкінішке орай бара алмаймын">
          <label for="q1_no">Өкінішке орай бара алмаймын</label>
        </div>

        <div class="radio-group">
          <p>Неше адам болып келесіздер?</p>
          <div style="display:flex;align-items:center;gap:12px;justify-content:center;">
            <button type="button" id="decrease" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:#000;padding:0 6px;">−</button>
            <span id="peopleCount" style="font-size:1.3rem;min-width:30px;text-align:center;color:#000;">1</span>
            <button type="button" id="increase" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:#000;padding:0 6px;">+</button>
          </div>
          <input type="hidden" name="choice" id="choiceHidden" value="1">
        </div>

        <button type="submit" class="btn-submit">Жауапты жіберемін</button>
      </div>
    </form>
  </div>
</div>

<!-- ФОТО 8 (INSTAGRAM) -->
<div class="element-animation">
  <a href="https://www.instagram.com/toiga_shaqyrtugo/" target="_blank">
    <img src="photo8.jpg" alt="photo8">
  </a>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // --- Элементтер ---
    const modal = document.getElementById('musicModal');
    const playBtn = document.getElementById('playMusicBtn');
    const audio = document.getElementById('backgroundMusic');

    // --- Функция закрытия модалки и запуска музыки ---
    function openInvitation() {
      // Запускаем музыку
      audio.play().then(() => {
        console.log('Музыка играет');
      }).catch((err) => {
        console.warn('Не удалось запустить музыку:', err);
      });

      // Скрываем модалку с плавным исчезновением
      modal.classList.add('hidden');
      // Через 0.5с убираем из DOM, чтобы не мешать кликам
      setTimeout(() => {
        modal.style.display = 'none';
      }, 500);

      // Показываем все скрытые элементы (если они были скрыты)
      document.querySelectorAll('.element-animation').forEach(el => el.classList.add('element-show'));

      // Запускаем автопрокрутку, если ещё не запущена
      if (!rafId) {
        rafId = requestAnimationFrame(loop);
        startAuto();
      }
    }

    // --- Обработчик клика по кнопке ---
    playBtn.addEventListener('click', openInvitation);

    // Также можно закрыть модалку по клику на фон (опционально)
    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        openInvitation();
      }
    });

    // --- ФОТОЛАРДЫҢ ПАЙДА БОЛУЫ (после модалки они уже показаны) ---
    // Но если модалка закрыта, то они покажутся, но мы их покажем в openInvitation.
    // Для безопасности добавим observer, но он сработает после закрытия модалки,
    // т.к. элементы уже visible.
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('element-show');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.element-animation').forEach(el => observer.observe(el));

    // --- ТАЙМЕР ---
    function updateCountdown() {
      const end = new Date("October 17, 2026 17:00:00").getTime();
      const now = Date.now();
      let diff = end - now;
      if (diff <= 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        return;
      }
      document.getElementById('days').textContent = String(Math.floor(diff / (1000*60*60*24))).padStart(2,'0');
      document.getElementById('hours').textContent = String(Math.floor((diff % (1000*60*60*24)) / (1000*60*60))).padStart(2,'0');
      document.getElementById('minutes').textContent = String(Math.floor((diff % (1000*60*60)) / (1000*60))).padStart(2,'0');
      document.getElementById('seconds').textContent = String(Math.floor((diff % (1000*60)) / 1000)).padStart(2,'0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);

    // --- АДАМ САНЫ ---
    let count = 1;
    document.getElementById('decrease').addEventListener('click', () => {
      if (count > 1) {
        count--;
        document.getElementById('peopleCount').textContent = count;
        document.getElementById('choiceHidden').value = count;
      }
    });
    document.getElementById('increase').addEventListener('click', () => {
      count++;
      document.getElementById('peopleCount').textContent = count;
      document.getElementById('choiceHidden').value = count;
    });

    // --- ФОРМА ---
    const form = document.getElementById('form');
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzed_5neOpvQv35LT35gF9NbpHa4Et50qFOq4bAPLDAOWr143e7PEmo0uYngnKUlqk2/exec';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.querySelector('[name="name"]:checked');
      const choice = document.querySelector('[name="choice"]');
      const message = document.querySelector('[name="message"]');

      const data = {
        name: name ? name.value : '',
        choice: choice ? choice.value : '',
        message: message.value.trim()
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch (err) {
        console.error('Submit error:', err);
      }

      if (name) name.checked = false;
      count = 1;
      document.getElementById('peopleCount').textContent = count;
      document.getElementById('choiceHidden').value = count;
      message.value = '';
      alert('Жауабыңызға рахмет!');
    });

    // --- АВТОСКРОЛЛ (запускается после модалки) ---
    const SPEED_PX_PER_SEC = 100;
    const RESTART_DELAY_MS = 5000;
    let isRunning = false, resumeTimer = null, rafId = null, lastTs = 0, accum = 0;

    function safeScrollBy(step) {
      const before = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      window.scrollBy(0, step);
      let after = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      if (after === before) {
        document.documentElement.scrollTop = before + step;
        after = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
        if (after === before) document.body.scrollTop = before + step;
      }
    }

    function atBottom() {
      const maxScroll = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight) - window.innerHeight;
      const y = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      return y >= maxScroll - 1;
    }

    function loop(ts) {
      rafId = requestAnimationFrame(loop);
      if (!isRunning) { lastTs = ts; return; }
      if (!lastTs) lastTs = ts;
      const dt = ts - lastTs;
      lastTs = ts;
      accum += (SPEED_PX_PER_SEC * dt) / 1000;
      const step = Math.floor(accum);
      if (step >= 1) {
        accum -= step;
        if (atBottom()) { stopAuto(); cancelAnimationFrame(rafId); rafId = null; return; }
        safeScrollBy(step);
      }
    }

    function startAuto() { if (!isRunning) isRunning = true; }
    function stopAuto() { isRunning = false; }
    function restartAfterDelay() {
      clearTimeout(resumeTimer);
      resumeTimer = setTimeout(() => startAuto(), RESTART_DELAY_MS);
    }

    const onInteract = () => { stopAuto(); restartAfterDelay(); };
    ['touchstart','touchmove','wheel','mousedown','keydown'].forEach(ev => 
      window.addEventListener(ev, onInteract, { passive: true })
    );

    // Не запускаем автопрокрутку сразу, она начнётся после модалки
    // Но для инициализации rafId мы создадим его позже.
    // В openInvitation мы запускаем loop и startAuto, если rafId нет.
  });
</script>

</body>
</html>
