<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="Аслан & Айнагүлдің үйлену тойына шақыру!">
  <meta property="og:description" content="15.08.2026">
  <meta property="og:image" content="https://lh3.googleusercontent.com/pw/AP1GczNwOy4E5977wdPWxlufPMn419SM8GRybSco84X668z7OqMEG_rUHgkSx6DsAZKDYloip-Hf-ivLTNfHFnJ_YuzpM8TRJvSVZrR1bU6jLh1P1vheJO-ON2hVe2Wog_4_VCdukWlRUNCRvmGe1PHvXMo2=w786-h912-s-no-gm?authuser=0">

  <title>Аслан & Айнагүлдің үйлену тойына шақыру!</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

  <!-- Свои стили -->
  <link rel="stylesheet" href="css.css">
  <link rel="stylesheet" href="sakura.css">
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Piazzolla:wght@100&display=swap" rel="stylesheet">
</head>
<body>

  <center>
    <div class="fade-in" id="content">
      <img src="photo1.png" style="width: 100%;" loading="eager">
    </div>
  </center>

  <center>
    <div class="element-animation">
      <img src="photo2.png" style="width: 100%;">
    </div>
  </center>

  <center>
    <div class="countdown-container" style="margin-top:20px;">
      <div class="countdown-item" style="margin-bottom: 30px;">
        <span id="days"></span>
        <span style="font-size: 13px;text-align: center;">күн</span>
      </div>
      <h2 style="margin-top:3px;">:</h2>
      <div class="countdown-item">
        <span id="hours"></span>
        <span style="font-size: 13px;text-align: center;">сағат</span>
      </div>
      <h2 style="margin-top:3px;">:</h2>
      <div class="countdown-item">
        <span id="minutes"></span>
        <span style="font-size: 13px;text-align: center;">минут</span>
      </div>
      <h2 style="margin-top:3px;">:</h2>
      <div class="countdown-item">
        <span id="seconds"></span>
        <span style="font-size: 13px;text-align: center;">секунд</span>
      </div>
    </div>
  </center>

  <center>
    <div class="element-animation">
      <a href="https://go.2gis.com/fQa4p">
        <img src="" style="width: 100%; margin-top: 40px;">
      </a>
    </div>
  </center>

  <center>
    <div class="element-animation">
      <img src="" style="width: 100%;margin-top: 50px; margin-bottom: 25px;">
    </div>
  </center>

  <center style="margin-top: 0px;">
    <form class="transparent" method="post" id="form">
      <div class="form-inner">

        <div class="radio-group" required>
          <p style="color:#000000;">Келесіз бе?</p>
          <input type="radio" id="question1_yes" name="name" value="Иә барамын" required>
          <label for="question1_yes" style="color:#000000;">Иә барамын</label><br>

          <input type="radio" id="question1_with" name="name" value="Жұбайыммен барамын" required>
          <label for="question1_with" style="color:#000000;">Жұбайыммен барамын</label><br>

          <input type="radio" id="question1_no" name="name" value="Бара алмаймын" required>
          <label for="question1_no" style="color:#000000;">Бара алмаймын</label>
        </div>
        <br>

        <div class="radio-group" required>
          <p style="color:#000000;">Неше адам болып келесіздер?</p>
          <div style="display:flex;align-items:center;gap:14px;">
            <button type="button" id="decrease" style="font-size:15px; border-radius: 50px; color: black;">−</button>
            <span id="peopleCount" style="font-size:20px;min-width:20px;display:inline-block;text-align:center; color: black;">1</span>
            <button type="button" id="increase" style="font-size:15px; border-radius: 50px; color: black;">+</button>
          </div>
          <input type="hidden" name="choice" id="choice" value="1">
        </div>
        <br>

        <textarea required name="message" maxlength="100" id="message" cols="30" rows="4"
                  placeholder="Есіміңізді жазыңыз"></textarea>

        <input type="submit" value="Жіберу" style="color:white;" class="btn">
      </div>
    </form>
  </center>

  <center>
    <div class="element-animation">
      <img src="" style="width: 100%;margin-top: 50px;">
    </div>
  </center>

  <!-- Модал -->
  <div id="musicModal" class="modal">
    <div class="modal-content">
      <img src="" class="kk">
      <button id="playMusic" style="color: black;">Шақыртуды ашу</button>
    </div>
  </div>

  <!-- Аудио -->
  <audio id="backgroundMusic" loop playsinline preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- Скрипты -->
  <script src="sakura.js" defer></script>
  <script src="main.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous" async></script>
</body>
</html>
