<script>
document.addEventListener('DOMContentLoaded', function () {

  /* ---------- Плавное появление первой фотографии ---------- */
  var mainObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        mainObserver.unobserve(entry.target);
      }
    });
  });
  document.querySelectorAll('.fade-in').forEach(function (el) {
    mainObserver.observe(el);
  });

  /* ---------- Фотографии появляются по очереди при прокрутке ---------- */
  var sequenceElements = document.querySelectorAll('.element-animation');
  sequenceElements.forEach(function (el, index) {
    el.style.transitionDelay = (index * 0.15) + 's';
  });

  var sequenceObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('element-show');
        sequenceObserver.unobserve(entry.target);
      }
    });
  }, { threshold: [0.5] });
  sequenceElements.forEach(function (el) {
    sequenceObserver.observe(el);
  });

  /* ---------- Музыка ---------- */
  var musicButton = document.getElementById('musicButton');
  var music = document.getElementById('music');
  var buttonIcon = document.getElementById('buttonIcon');
  var isPlaying = false;

  if (musicButton && music && buttonIcon) {
    musicButton.addEventListener('click', function (e) {
      e.preventDefault();
      if (isPlaying) {
        music.pause();
        buttonIcon.src = 'play.png';
        isPlaying = false;
      } else {
        var playPromise = music.play();
        if (playPromise !== undefined) {
          playPromise.then(function () {
            buttonIcon.src = 'stop.png';
            isPlaying = true;
          }).catch(function (err) {
            console.error('Музыканы ойнату мүмкін болмады:', err);
            alert('Музыка ойнатылмады: ' + err.message);
          });
        } else {
          buttonIcon.src = 'stop.png';
          isPlaying = true;
        }
      }
    });

    music.addEventListener('ended', function () {
      buttonIcon.src = 'play.png';
      isPlaying = false;
    });
  } else {
    console.error('Музыка батырмасы табылмады: musicButton, music немесе buttonIcon элементі жоқ.');
  }

  /* ---------- Обратный отсчёт ---------- */
  var timerInterval = setInterval(updateCountdown, 1000);
  updateCountdown();

  function updateCountdown() {
    var endDate = new Date('September 17, 2026 19:00:00').getTime();
    var now = new Date().getTime();
    var distance = endDate - now;

    if (distance < 0) {
      clearInterval(timerInterval);
      document.getElementById('days').innerText = '00';
      document.getElementById('hours').innerText = '00';
      document.getElementById('minutes').innerText = '00';
      document.getElementById('seconds').innerText = '00';
      return;
    }

    var days = Math.floor(distance / (1000 * 60 * 60 * 24));
    var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    var seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById('days').innerText = days;
    document.getElementById('hours').innerText = hours;
    document.getElementById('minutes').innerText = minutes;
    document.getElementById('seconds').innerText = seconds;
  }

  /* ---------- Степпер (неше адам болып келеді) ---------- */
  var countDisplay = document.getElementById('countDisplay');
  var countHidden = document.getElementById('count');
  var minCount = 1;
  var maxCount = 20;

  function setCount(val) {
    val = Math.max(minCount, Math.min(maxCount, val));
    countHidden.value = val;
    countDisplay.textContent = val;
  }

  document.getElementById('countMinus').addEventListener('click', function () {
    setCount(parseInt(countHidden.value, 10) - 1);
  });
  document.getElementById('countPlus').addEventListener('click', function () {
    setCount(parseInt(countHidden.value, 10) + 1);
  });

  /* ---------- Форма ---------- */
  var URL_APP = '';
  var form = document.querySelector('#form');
  form.action = URL_APP;

  function isFilled(details) {
    return Boolean(details.attend && details.message);
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();

    var attend = document.querySelector('[name=name]:checked');
    var message = document.querySelector('[name=message]');
    var countField = document.querySelector('[name=count]');

    var details = {
      attend: attend ? attend.value : '',
      message: message.value.trim(),
      count: countField ? countField.value.trim() : ''
    };

    if (!isFilled(details)) {
      alert('Барлық жолдарды толтырыңыз!');
      return;
    }

    // doPost() бағаналарды осы ретпен жазады: A = name, B = choice, C = message
    // Кестеде: A = Иә/Жоқ, B = Саны, C = Есімі
    var payload = {
      name: details.attend,
      choice: details.count,
      message: details.message
    };

    message.value = '';
    if (attend) attend.checked = false;
    setCount(1);
    alert('Жауабыңызға рахмет!');

    fetch(URL_APP, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      mode: 'no-cors',
      body: JSON.stringify(payload)
    }).catch(function (err) {
      console.error('Error:', err);
      alert('Ошибка!');
