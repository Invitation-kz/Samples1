<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="✦ Тімур мен Зарина тойына шақыру!">
<meta property="og:description" content="7 Қаңтар 2026">
<meta property="og:image" content="photo1.jpg">
<title>✦ Тімур мен Зарина тойына шақыру!</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="modal-open">

<!-- ========== MODAL ========== -->
<div id="modal" class="modal">
  <div class="modal-box">
    <img src="cover.jpg" alt="cover" class="modal-img">
    <button id="openBtn">✦ Шақырту хатты ашу</button>
  </div>
</div>

<!-- ========== CONTENT ========== -->
<div id="page" style="display:none">

  <div class="fade-in">
    <img src="photo1.jpg" class="full-img" alt="">
  </div>

  <div class="fade-in center names-block">
    <p class="pre-title">ТОЙҒА ШАҚЫРАМЫЗ</p>
    <h1 class="names">Тімур <span>&</span> Зарина</h1>
    <p class="date-text">7 Қаңтар 2026</p>
  </div>

  <div class="fade-in center">
    <div class="countdown">
      <div class="cd-item"><span id="days">00</span><small>күн</small></div>
      <div class="cd-sep">:</div>
      <div class="cd-item"><span id="hours">00</span><small>сағат</small></div>
      <div class="cd-sep">:</div>
      <div class="cd-item"><span id="minutes">00</span><small>минут</small></div>
      <div class="cd-sep">:</div>
      <div class="cd-item"><span id="seconds">00</span><small>секунд</small></div>
    </div>
  </div>

  <div class="fade-in">
    <a href="https://maps.google.com/?q=Астана,+Нұрлы+жол+1">
      <img src="photo2.jpg" class="full-img" alt="">
    </a>
  </div>

  <div class="fade-in">
    <img src="photo3.jpg" class="full-img" alt="">
  </div>

  <div class="fade-in center form-section">
    <form id="rsvpForm">
      <div class="radio-group">
        <p>Келесіз бе?</p>
        <label><input type="radio" name="attend" value="Иә барамын" required> Иә барамын</label>
        <label><input type="radio" name="attend" value="Серіктесіммен барамын"> Серіктесіммен барамын</label>
        <label><input type="radio" name="attend" value="Бара алмаймын"> Бара алмаймын</label>
      </div>
      <div class="counter-group">
        <p>Неше адам?</p>
        <div class="counter">
          <button type="button" id="dec">−</button>
          <span id="cnt">1</span>
          <button type="button" id="inc">+</button>
        </div>
        <input type="hidden" id="countVal" name="count" value="1">
      </div>
      <input type="text" name="name" placeholder="Есіміңізді жазыңыз" required>
      <button type="submit">Жіберу ✦</button>
    </form>
  </div>

  <div class="fade-in">
    <img src="photo4.jpg" class="full-img" alt="">
  </div>

</div>

<audio id="audio" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>
<canvas id="particles"></canvas>

<script>
const CONFIG = {
  eventDate: "2026-01-07T19:00:00",
  googleScriptUrl: "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec",
  autoScrollSpeed: 80,
  particleColor: ["rgba(255,255,255,0.8)","rgba(192,192,192,0.6)","rgba(200,180,255,0.5)"],
};

const modal = document.getElementById("modal");
const page  = document.getElementById("page");
const audio = document.getElementById("audio");
document.getElementById("openBtn").addEventListener("click", () => {
  modal.style.display = "none";
  page.style.display  = "block";
  document.body.classList.remove("modal-open");
  audio.play().catch(()=>{});
  startScroll(); startParticles(); observeFade(); startCountdown();
});

function startCountdown() {
  function tick() {
    const diff = new Date(CONFIG.eventDate) - new Date();
    if (diff <= 0) { ["days","hours","minutes","seconds"].forEach(id => document.getElementById(id).textContent = "00"); return; }
    document.getElementById("days").textContent    = String(Math.floor(diff/86400000)).padStart(2,"0");
    document.getElementById("hours").textContent   = String(Math.floor(diff%86400000/3600000)).padStart(2,"0");
    document.getElementById("minutes").textContent = String(Math.floor(diff%3600000/60000)).padStart(2,"0");
    document.getElementById("seconds").textContent = String(Math.floor(diff%60000/1000)).padStart(2,"0");
  }
  tick(); setInterval(tick, 1000);
}

let scrolling = true, scrollTimer = null;
function startScroll() {
  let last = 0, acc = 0;
  function loop(ts) {
    if (scrolling) {
      acc += CONFIG.autoScrollSpeed * (ts - last) / 1000;
      const step = Math.floor(acc); acc -= step;
      if (window.scrollY < document.documentElement.scrollHeight - window.innerHeight) window.scrollBy(0, step);
    }
    last = ts; requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
const pause = () => { scrolling = false; clearTimeout(scrollTimer); scrollTimer = setTimeout(() => scrolling = true, 4000); };
["touchstart","wheel","mousedown","keydown"].forEach(e => window.addEventListener(e, pause, {passive:true}));

function observeFade() {
  const obs = new IntersectionObserver(entries => entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add("visible"); obs.unobserve(e.target); } }), {threshold:0.15});
  document.querySelectorAll(".fade-in").forEach(el => obs.observe(el));
}

// Stars / sparkles
function startParticles() {
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  window.addEventListener("resize", () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
  const stars = [];
  function Star() {
    this.x = Math.random() * canvas.width; this.y = -10;
    this.size = 1 + Math.random() * 3; this.speed = 0.5 + Math.random() * 1;
    this.drift = (Math.random() - 0.5) * 0.8; this.alpha = 0.4 + Math.random() * 0.6;
    this.color = CONFIG.particleColor[Math.floor(Math.random() * CONFIG.particleColor.length)];
  }
  setInterval(() => stars.push(new Star()), 200);
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach((s, i) => {
      s.y += s.speed; s.x += s.drift;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
      ctx.fillStyle = s.color; ctx.globalAlpha = s.alpha; ctx.fill(); ctx.globalAlpha = 1;
      if (s.y > canvas.height + 10) stars.splice(i, 1);
    });
    requestAnimationFrame(draw);
  }
  draw();
}

let cnt = 1;
document.getElementById("dec").addEventListener("click", () => { if(cnt>1){ cnt--; document.getElementById("cnt").textContent=cnt; document.getElementById("countVal").value=cnt; } });
document.getElementById("inc").addEventListener("click", () => { cnt++; document.getElementById("cnt").textContent=cnt; document.getElementById("countVal").value=cnt; });

document.getElementById("rsvpForm").addEventListener("submit", async e => {
  e.preventDefault();
  const body = new URLSearchParams(new FormData(e.target)).toString();
  e.target.reset(); cnt=1; document.getElementById("cnt").textContent=1; document.getElementById("countVal").value=1;
  alert("Жауабыңызға рахмет! ✦");
  fetch(CONFIG.googleScriptUrl, { method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, mode:"no-cors", body }).catch(()=>{});
});
</script>
</body>
</html>
