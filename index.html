<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS — Toiga Shaqyrtugo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:   #ebebeb;
    --ink:  #2e2e2e;
    --mid:  #888;
    --line: rgba(46,46,46,0.12);
  }

  html { font-size: 16px; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 48px 48px 32px;
    border-bottom: 1px solid var(--line);
  }

  .logo img {
    height: 72px;
    display: block;
  }

  .header-meta {
    text-align: right;
    font-size: 11px;
    color: var(--mid);
    letter-spacing: 0.06em;
    line-height: 1.8;
  }

  .intro {
    padding: 64px 48px 48px;
    max-width: 560px;
  }

  .intro h1 {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 300;
    line-height: 1.3;
    letter-spacing: -0.01em;
    margin-bottom: 16px;
  }

  .intro p {
    font-size: 14px;
    color: var(--mid);
    line-height: 1.7;
  }

  .grid-label {
    padding: 0 48px 20px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mid);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1px;
    background: var(--line);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  .card {
    background: var(--bg);
    padding: 36px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    text-decoration: none;
    color: inherit;
    transition: background 0.2s;
    position: relative;
    overflow: hidden;
  }

  .card:hover { background: #e2e2e2; }
  .card:hover .card-arrow { opacity: 1; transform: translate(0, 0); }

  .card-num {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--mid);
  }

  .card-swatch {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .card-title {
    font-size: 18px;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }

  .card-desc {
    font-size: 12px;
    color: var(--mid);
    line-height: 1.6;
    flex: 1;
  }

  .card-tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 1px solid var(--line);
    padding: 4px 10px;
    color: var(--mid);
    align-self: flex-start;
  }

  .card-arrow {
    position: absolute;
    top: 36px;
    right: 36px;
    font-size: 18px;
    opacity: 0;
    transform: translate(-4px, 4px);
    transition: opacity 0.2s, transform 0.2s;
    color: var(--ink);
  }

  .card.empty {
    pointer-events: none;
    opacity: 0.35;
  }

  footer {
    padding: 40px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--line);
  }

  footer span {
    font-size: 11px;
    color: var(--mid);
    letter-spacing: 0.08em;
  }

  @media (max-width: 600px) {
    header, .intro, .grid-label, footer { padding-left: 24px; padding-right: 24px; }
    .card { padding: 28px 24px; }
    .card-arrow { top: 28px; right: 24px; }
    .logo img { height: 52px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="tou.png" alt="TS — Toiga Shaqyrtugo">
  </div>
</header>

<div class="intro">
  <h1>Кез келген себепке арналған цифрлық шақыртулар!</h1>
</div>

<div class="grid">

  <a class="card" href="Samples/Sample1/index.html">
    <div class="card-swatch" style="background: linear-gradient(135deg,#2d6a4f,#74c69d)"></div>
    <div class="card-title">Жасыл-ақ түсті, жапырақтармен</div>
    <span class="card-tag">Үйлену Той</span>
    <span class="card-arrow">↗</span>
  </a>

  <a class="card" href="Samples/Sample2/index.html">
    <div class="card-swatch" style="background: linear-gradient(135deg,#00000000,#949494)"></div>
    <div class="card-title">Қара-Ақ, минимализм стильнде</div>
    <span class="card-tag">Үйлену Той</span>
    <span class="card-arrow">↗</span>
  </a>

  <a class="card" href="Samples/Sample3/index.html">
    <div class="card-swatch" style="background: linear-gradient(135deg,#b90d0d,#c67474)"></div>
    <div class="card-title">Қызыл түсті</div>
    <span class="card-tag">Қыз Ұзату</span>
    <span class="card-arrow">↗</span>
  </a>


</div>

<footer>
  <a href="https://www.instagram.com/toiga_shaqyrtugo/" target="_blank" style="font-size:11px;color:var(--mid);letter-spacing:0.08em;text-decoration:none;">instagram: @toiga_shaqyrtugo</a>
</footer>

</body>
</html>
